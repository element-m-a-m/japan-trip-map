<title>מפת התכנון ליפן 2026</title>
<style>
  :root {
    --indigo: #2A3B5C;
    --indigo-br: #4E6FA8;
    --momiji: #B8452F;
    --ginkgo: #C08A2E;
    --jade: #2F7D6B;
    --jade-br: #3FA189;

    --bg: #EEF0F4;
    --surface: #FFFFFF;
    --surface-2: #F7F8FA;
    --surface-3: #EDEFF3;
    --text: #171C26;
    --muted: #5C6577;
    --faint: #8A93A5;
    --border: #DCE0E8;
    --border-2: #C3CAD6;

    --sea-1: #DCE4F0;
    --sea-2: #C6D3E6;
    --land-1: #FBFAF7;
    --land-2: #E8E4DA;
    --land-edge: #A9B3C4;
    --grid: rgba(42, 59, 92, .10);

    --shadow-s: 0 1px 2px rgba(23, 28, 38, .06);
    --shadow-m: 0 4px 16px -6px rgba(23, 28, 38, .22);
    --shadow-l: 0 18px 50px -24px rgba(23, 28, 38, .5);

    --he: "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --indigo: #7B9AD0; --indigo-br: #9DB6DF;
      --momiji: #E0765C; --ginkgo: #D9A84E;
      --jade: #4FB49C; --jade-br: #6ECBB5;
      --bg: #0E1118; --surface: #171B24; --surface-2: #12161E; --surface-3: #1E2430;
      --text: #E9ECF2; --muted: #98A1B3; --faint: #6B7486;
      --border: #262D3B; --border-2: #38414F;
      --sea-1: #0C1420; --sea-2: #131F31;
      --land-1: #2A3140; --land-2: #1F2531;
      --land-edge: #46536B; --grid: rgba(123, 154, 208, .10);
      --shadow-s: 0 1px 2px rgba(0,0,0,.4);
      --shadow-m: 0 4px 16px -6px rgba(0,0,0,.6);
      --shadow-l: 0 18px 50px -24px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --indigo: #7B9AD0; --indigo-br: #9DB6DF;
    --momiji: #E0765C; --ginkgo: #D9A84E;
    --jade: #4FB49C; --jade-br: #6ECBB5;
    --bg: #0E1118; --surface: #171B24; --surface-2: #12161E; --surface-3: #1E2430;
    --text: #E9ECF2; --muted: #98A1B3; --faint: #6B7486;
    --border: #262D3B; --border-2: #38414F;
    --sea-1: #0C1420; --sea-2: #131F31;
    --land-1: #2A3140; --land-2: #1F2531;
    --land-edge: #46536B; --grid: rgba(123, 154, 208, .10);
    --shadow-s: 0 1px 2px rgba(0,0,0,.4);
    --shadow-m: 0 4px 16px -6px rgba(0,0,0,.6);
    --shadow-l: 0 18px 50px -24px rgba(0,0,0,.9);
  }
  :root[data-theme="light"] {
    --indigo: #2A3B5C; --indigo-br: #4E6FA8;
    --momiji: #B8452F; --ginkgo: #C08A2E;
    --jade: #2F7D6B; --jade-br: #3FA189;
    --bg: #EEF0F4; --surface: #FFFFFF; --surface-2: #F7F8FA; --surface-3: #EDEFF3;
    --text: #171C26; --muted: #5C6577; --faint: #8A93A5;
    --border: #DCE0E8; --border-2: #C3CAD6;
    --sea-1: #DCE4F0; --sea-2: #C6D3E6;
    --land-1: #FBFAF7; --land-2: #E8E4DA;
    --land-edge: #A9B3C4; --grid: rgba(42, 59, 92, .10);
    --shadow-s: 0 1px 2px rgba(23,28,38,.06);
    --shadow-m: 0 4px 16px -6px rgba(23,28,38,.22);
    --shadow-l: 0 18px 50px -24px rgba(23,28,38,.5);
  }

  * { box-sizing: border-box; }

  .app {
    direction: rtl;
    background: var(--bg);
    color: var(--text);
    font-family: var(--he);
    font-size: 15px;
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 940px) {
    .app { height: auto; min-height: 100vh; overflow: visible; }
  }

  bdi, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

  /* ================= TOPBAR ================= */
  .topbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px clamp(12px, 2.5vw, 22px);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; margin-inline-end: auto; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .brand .sub { font-size: 11.5px; color: var(--faint); }

  .stat-strip { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 11px; min-width: 96px;
    display: flex; flex-direction: column; gap: 1px;
  }
  .stat .lab { font-size: 10px; letter-spacing: .08em; color: var(--faint); font-weight: 700; }
  .stat .val { font-family: var(--mono); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
  .stat.paid .val { color: var(--jade); }
  .stat.plan .val { color: var(--momiji); }
  .stat.left .val { color: var(--indigo); }

  /* ================= LAYOUT ================= */
  .main { display: flex; flex: 1; min-height: 0; align-items: stretch; }
  @media (max-width: 940px) { .main { flex-direction: column; } }

  .panel {
    width: 400px; flex: 0 0 400px;
    background: var(--surface);
    border-inline-start: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  @media (max-width: 940px) { .panel { width: auto; flex: 1 1 auto; border-inline-start: 0; border-top: 1px solid var(--border); } }

  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .tab {
    flex: 1; padding: 11px 6px; background: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--muted);
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--indigo); border-bottom-color: var(--indigo); background: var(--surface); }
  .tab:focus-visible { outline: 2px solid var(--indigo); outline-offset: -3px; }

  .tabpanel { padding: 16px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 940px) { .tabpanel { max-height: 62vh; } }
  .tabpanel[hidden] { display: none; }

  /* ================= MAP ================= */
  .mapwrap { flex: 1; position: relative; min-height: 420px; overflow: hidden; background: linear-gradient(170deg, var(--sea-1), var(--sea-2)); }
  @media (max-width: 940px) { .mapwrap { min-height: 400px; flex: 0 0 52vh; } }

  .stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 42%; }

  .plane {
    position: absolute; left: 50%; top: 50%;
    height: min(80%, 600px);
    transform-style: preserve-3d;
    transform:
      translate(-50%, -50%)
      translate(var(--panx), var(--pany))
      rotateX(var(--tilt))
      scale(var(--zoom));
    transition: transform .5s cubic-bezier(.22,.8,.3,1);
    will-change: transform;
  }
  .plane.dragging { transition: none; }

  .mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .land { fill: url(#landgrad); stroke: var(--land-edge); stroke-width: 1.6; stroke-linejoin: round; }
  .gridline { stroke: var(--grid); stroke-width: 1; fill: none; }
  /* route lines are decoration: clicks pass through them to the map */
  .routeline { fill: none; stroke: var(--momiji); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 11; opacity: .95; pointer-events: none; }
  .routeline.solid { stroke-dasharray: none; opacity: .55; stroke-width: 2.4; }
  .gridline, .shadow-dot { pointer-events: none; }

  /* the pin layer must not swallow clicks meant for the map underneath */
  .pins { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
  .pins .pin { pointer-events: auto; }

  .pin {
    position: absolute; transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotateX(calc(-1 * var(--tilt)));
    background: none; border: 0; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    font-family: inherit; z-index: 2;
  }
  .pin:focus-visible { outline: none; }
  .pin:focus-visible .head { outline: 2px solid var(--text); outline-offset: 2px; }

  .pin .label {
    position: relative;
    font-size: 11px; font-weight: 700; white-space: nowrap;
    padding: 2px 7px; border-radius: 3px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-2);
    box-shadow: var(--shadow-s);
    margin-bottom: calc(3px + var(--lift, 0px));
    transform: translateX(var(--dx, 0px));
    transition: opacity .15s;
  }
  /* leader line back down to the pin when a label was lifted straight up */
  .pin .label::after {
    content: ""; position: absolute; top: 100%; right: 50%;
    width: 1px; height: var(--lift, 0px);
    background: var(--border-2);
  }
  .pin.off .label::after { display: none; }
  /* no room at this zoom: the pin stays, the name appears on demand */
  .pin.nolabel .label { opacity: 0; }
  .pin.nolabel:hover .label,
  .pin.nolabel:focus-within .label,
  .pin.nolabel.sel .label { opacity: 1; }
  .pin[data-role="base"] { z-index: 3; }
  .pin.sel, .pin:hover, .pin:focus-within { z-index: 8; }
  .pin .head {
    position: relative;
    width: 15px; height: 15px; border-radius: 50%;
    border: 2.5px solid var(--surface);
    background: var(--faint);
    box-shadow: var(--shadow-m);
    transition: transform .15s, background .2s;
  }
  /* generous invisible hit area so the pin is easy to grab */
  .pin .head::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; }
  .pin .stem { width: 2px; height: 16px; background: linear-gradient(to bottom, var(--border-2), transparent); }

  .pin[data-role="airport"] .head { border-radius: 2px; transform: rotate(45deg); }
  .pin[data-state="chosen"] .head { background: var(--momiji); width: 19px; height: 19px; }
  .pin[data-state="booked"] .head { background: var(--jade); width: 19px; height: 19px; }
  .pin[data-state="chosen"] .label, .pin[data-state="booked"] .label { border-color: currentColor; }
  .pin[data-state="chosen"] .label { color: var(--momiji); }
  .pin[data-state="booked"] .label { color: var(--jade); }
  .pin.sel .head { box-shadow: 0 0 0 5px color-mix(in srgb, var(--indigo) 30%, transparent), var(--shadow-m); }
  .pin.sel .label { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .pin:hover .head { transform: scale(1.25); }
  .pin[data-role="airport"]:hover .head { transform: rotate(45deg) scale(1.25); }
  .pin:hover { z-index: 5; }

  .shadow-dot {
    position: absolute; width: 16px; height: 6px; border-radius: 50%;
    background: rgba(0,0,0,.22); filter: blur(2px);
    transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
  }

  .badge-n {
    position: absolute; top: -5px; inset-inline-end: -7px;
    background: var(--ginkgo); color: #16181d;
    font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    min-width: 15px; height: 15px; border-radius: 8px;
    display: grid; place-items: center; padding: 0 3px;
    border: 2px solid var(--surface);
  }

  /* map controls */
  .mapctl {
    position: absolute; inset-block-start: 12px; inset-inline-start: 12px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px;
  }
  .mapctl button {
    width: 34px; height: 34px; border-radius: 4px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-2); cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700;
    display: grid; place-items: center; box-shadow: var(--shadow-s);
    transition: background .15s;
  }
  .mapctl button:hover { background: var(--surface-3); }
  .mapctl button:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .mapctl button.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }

  .legend {
    position: absolute; inset-block-end: 12px; inset-inline-start: 12px; z-index: 20;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 9px 12px; display: flex; flex-direction: column; gap: 5px;
    font-size: 11.5px; color: var(--muted); box-shadow: var(--shadow-s);
    backdrop-filter: blur(6px);
  }
  .legend > div { display: flex; align-items: center; gap: 7px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-hint {
    display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
    margin-top: 5px; padding-top: 6px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--faint);
  }

  /* ================= PANEL WIDGETS ================= */
  .card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 5px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card > h3 {
    margin: 0; font-size: 11.5px; letter-spacing: .1em;
    color: var(--faint); font-weight: 700;
  }

  /* budget bar */
  .bbar { height: 26px; border-radius: 4px; background: var(--surface-3); position: relative; overflow: hidden; border: 1px solid var(--border); }
  .bbar .seg { position: absolute; top: 0; bottom: 0; }
  .bbar .seg.paid { background: var(--jade); right: 0; }
  .bbar .seg.plan { background: repeating-linear-gradient(-45deg, var(--momiji) 0 5px, color-mix(in srgb, var(--momiji) 60%, transparent) 5px 10px); }
  .tickrow { position: relative; height: 38px; }
  .tick { position: absolute; top: 0; transform: translateX(50%); font-size: 10px; color: var(--faint); white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tick.b { top: 15px; }
  .tick::before { content: ""; position: absolute; top: -30px; right: 50%; width: 2px; height: 28px; background: var(--text); opacity: .55; }
  .tick.b::before { height: 43px; top: -45px; }
  .tick.b::before { background: var(--momiji); opacity: .9; }
  .tick.a::before { background: var(--indigo); opacity: .9; }

  .verdict {
    padding: 10px 12px; border-radius: 4px; font-size: 14px; font-weight: 700;
    border: 1px solid; display: flex; align-items: center; gap: 8px;
  }
  .verdict.ok { color: var(--jade); border-color: color-mix(in srgb, var(--jade) 40%, transparent); background: color-mix(in srgb, var(--jade) 10%, transparent); }
  .verdict.mid { color: var(--ginkgo); border-color: color-mix(in srgb, var(--ginkgo) 40%, transparent); background: color-mix(in srgb, var(--ginkgo) 10%, transparent); }
  .verdict.over { color: var(--momiji); border-color: color-mix(in srgb, var(--momiji) 40%, transparent); background: color-mix(in srgb, var(--momiji) 10%, transparent); }

  /* category rows */
  .catrow { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-top: 1px solid var(--border); }
  .catrow:first-of-type { border-top: 0; }
  .catrow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13.5px; }
  .catrow .nums { font-family: var(--mono); font-size: 12px; color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; }
  .meter i.p { background: var(--jade); }
  .meter i.c { background: color-mix(in srgb, var(--momiji) 70%, transparent); }
  .catrow.over .nums { color: var(--momiji); font-weight: 700; }

  /* coach steps */
  .step {
    display: flex; gap: 11px; padding: 11px 12px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface);
    align-items: flex-start; width: 100%; text-align: right;
    font-family: inherit; cursor: default;
    transition: opacity .18s, border-color .18s, background .18s;
  }
  button.step { cursor: pointer; }
  button.step:hover { border-color: var(--border-2); background: var(--surface-3); }
  button.step:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }

  .step .ic {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    background: var(--surface-3); color: var(--muted); margin-top: 1px;
  }
  .step .body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .step .t { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .step .d { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .step .d b { color: var(--text); }

  .now-chip {
    font-size: 10px; letter-spacing: .06em; font-weight: 700;
    background: var(--momiji); color: #fff;
    padding: 1px 7px; border-radius: 8px;
  }

  /* three states: done, current, upcoming */
  .step.done { opacity: .5; }
  .step.done .ic { background: var(--jade); color: #fff; }
  .step.done .t { text-decoration: line-through; text-decoration-color: var(--border-2); }

  .step.current {
    opacity: 1;
    border-color: var(--momiji);
    background: color-mix(in srgb, var(--momiji) 8%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--momiji) 35%, transparent);
  }
  .step.current .ic { background: var(--momiji); color: #fff; }

  .step.future { opacity: .62; }
  .step.future:hover { opacity: .9; }

  /* price pair: shekel leads, yen supports */
  .pri { font-family: var(--mono); font-weight: 700; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .sec { font-family: var(--mono); font-size: .82em; color: var(--faint); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; font-weight: 400; }

  /* toast */
  .toast {
    position: fixed; inset-block-end: 18px; inset-inline-start: 50%;
    transform: translateX(50%) translateY(14px);
    background: var(--text); color: var(--bg);
    padding: 9px 16px; border-radius: 5px; font-size: 13.5px; font-weight: 700;
    box-shadow: var(--shadow-l); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    display: flex; align-items: center; gap: 12px;
  }
  .toast.on { opacity: 1; transform: translateX(50%) translateY(0); pointer-events: auto; }
  .toast button {
    background: none; border: 0; color: var(--ginkgo);
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0;
    text-decoration: underline;
  }

  /* place detail */
  .place-head { display: flex; flex-direction: column; gap: 4px; }
  .place-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .place-head .en { font-family: var(--mono); font-size: 11.5px; color: var(--faint); direction: ltr; }
  .place-note { margin: 0; font-size: 13.5px; color: var(--muted); }
  .pricehint { font-size: 12.5px; color: var(--ginkgo); font-weight: 700; }

  .item {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 11px; background: var(--surface);
    display: flex; flex-direction: column; gap: 7px;
  }
  .item .r1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item .nm { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .item .meta { font-size: 11.5px; color: var(--faint); }
  .item .amt { font-family: var(--mono); font-size: 14px; font-weight: 700; direction: ltr; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item[data-s="booked"] .amt { color: var(--jade); }
  .item[data-s="chosen"] .amt { color: var(--momiji); }
  .item[data-s="idea"] { opacity: .72; }
  .item[data-s="idea"] .amt { color: var(--faint); }

  .segbtns { display: flex; gap: 0; border: 1px solid var(--border-2); border-radius: 4px; overflow: hidden; }
  .segbtns button {
    flex: 1; padding: 5px 4px; border: 0; background: var(--surface-2);
    font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--muted);
    cursor: pointer; border-inline-start: 1px solid var(--border);
    transition: background .15s, color .15s;
  }
  .segbtns button:first-child { border-inline-start: 0; }
  .segbtns button:hover { background: var(--surface-3); }
  .segbtns button[aria-pressed="true"] { color: #fff; }
  .segbtns button[data-v="idea"][aria-pressed="true"] { background: var(--faint); }
  .segbtns button[data-v="chosen"][aria-pressed="true"] { background: var(--momiji); }
  .segbtns button[data-v="booked"][aria-pressed="true"] { background: var(--jade); }

  .row { display: flex; gap: 7px; align-items: center; }
  .row > * { min-width: 0; }

  label.fld { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--faint); font-weight: 700; letter-spacing: .05em; flex: 1; }
  input.in, select.in {
    font-family: inherit; font-size: 13.5px; padding: 7px 9px;
    border: 1px solid var(--border-2); border-radius: 4px;
    background: var(--surface); color: var(--text); width: 100%;
  }
  input.in[type="number"] { font-family: var(--mono); direction: ltr; text-align: right; }

    return '<span class="pri">' + nis(nisVal) + '</span> <span class="sec">' + yen(nisVal * RATE) + '</span>';
  }
  /* takes a yen range (how Japanese rates are quoted) and leads with shekels */
  function rangeHTML(yLow, yHigh) {
    return '<span class="pri">' + nis(yLow / RATE) + "-" + nis(yHigh / RATE) + '</span> ' +
           '<span class="sec">(' + yen(yLow) + "-" + yen(yHigh) + ')</span>';
  }

  /* ============ TOAST ============ */
  var toastEl = document.getElementById("toast"), toastT = null;
  function toast(msg, undoFn) {
    toastEl.innerHTML = "<span>" + msg + "</span>";
    if (undoFn) {
      var b = document.createElement("button");
      b.textContent = "ביטול";
      b.addEventListener("click", function () { undoFn(); hideToast(); });
      toastEl.appendChild(b);
    }
    toastEl.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(hideToast, undoFn ? 6000 : 2600);
  }
  function hideToast() { toastEl.classList.remove("on"); }

  function totals() {
    var t = { paid: FLIGHTS_PAID, plan: 0, nights: 0, cat: {} };
    Object.keys(CATS).forEach(function (c) { t.cat[c] = { paid: 0, plan: 0 }; });
    t.cat.flight.paid = FLIGHTS_PAID;
    S.items.forEach(function (it) {
      var amt = it.state === "booked" ? (it.actual != null ? it.actual : it.est) : it.est;
      amt = Number(amt) || 0;
      if (it.state === "booked") { t.paid += amt; t.cat[it.cat].paid += amt; }
      else if (it.state === "chosen") { t.plan += amt; t.cat[it.cat].plan += amt; }
      if (it.cat === "lodging" && it.state !== "idea") t.nights += Number(it.nights) || 0;
    });
    t.committed = t.paid + t.plan;
    return t;
  }

  /* ============ MAP RENDER ============ */
  var svg = document.getElementById("mapsvg");
  var plane = document.getElementById("plane");
  var pinsEl = document.getElementById("pins");

  function buildMap() {
    svg.setAttribute("viewBox", "0 0 " + VW + " " + VH);
    plane.style.aspectRatio = VW + " / " + VH;

    var g = document.getElementById("g-grid"), s = "";
    for (var la = 32; la <= 46; la += 2) {
      var y = projY(la) * VH;
      s += '<path class="gridline" d="M0 ' + y.toFixed(1) + ' H' + VW + '"/>';
    }
    for (var ln = 130; ln <= 146; ln += 2) {
      var x = projX(ln) * VW;
      s += '<path class="gridline" d="M' + x.toFixed(1) + ' 0 V' + VH + '"/>';
    }
    g.innerHTML = s;

    var gl = document.getElementById("g-land"), ls = "";
    ISLANDS.forEach(function (poly) {
      var d = poly.map(function (pt, i) {
        return (i ? "L" : "M") + (projX(pt[1]) * VW).toFixed(1) + " " + (projY(pt[0]) * VH).toFixed(1);
      }).join(" ") + " Z";
      ls += '<path class="land" d="' + d + '"/>';
    });
    gl.innerHTML = ls;
  }

  function routeOrder() {
    var chosen = {};
    S.items.forEach(function (it) { if (it.cat === "lodging" && it.state !== "idea") chosen[it.pid] = true; });
    var ids = Object.keys(chosen);
    ids.sort(function (a, b) {
      var oa = S.order[a] != null ? S.order[a] : 99, ob = S.order[b] != null ? S.order[b] : 99;
      if (oa !== ob) return oa - ob;
      return a.localeCompare(b);
    });
    return ids;
  }

  function drawRoute() {
    var ids = routeOrder(), gr = document.getElementById("g-routes");
    if (ids.length < 2) { gr.innerHTML = ""; return; }
    var d = ids.map(function (id, i) {
      var p = place(id); if (!p) return "";
      return (i ? "L" : "M") + (projX(p.lng) * VW).toFixed(1) + " " + (projY(p.lat) * VH).toFixed(1);
    }).join(" ");
    gr.innerHTML = '<path class="routeline solid" d="' + d + '"/><path class="routeline" d="' + d + '"/>';
  }

  function placeState(pid) {
    var mine = S.items.filter(function (i) { return i.pid === pid; });
    if (!mine.length) return "idea";
    var booked = mine.some(function (i) { return i.state === "booked"; });
    var chosen = mine.some(function (i) { return i.state === "chosen"; });
    if (booked && !chosen) return "booked";
    if (chosen || booked) return "chosen";
    return "idea";
  }

  function drawPins() {
    pinsEl.innerHTML = "";
    allPlaces().forEach(function (p) {
      var x = projX(p.lng) * 100, y = projY(p.lat) * 100;

      var sh = document.createElement("div");
      sh.className = "shadow-dot";
      sh.style.left = x + "%"; sh.style.top = y + "%";
      pinsEl.appendChild(sh);

      var n = S.items.filter(function (i) { return i.pid === p.id && i.state !== "idea"; }).length;
      var b = document.createElement("button");
      b.className = "pin" + (S.sel === p.id ? " sel" : "");
      b.style.left = x + "%"; b.style.top = y + "%";
      b.setAttribute("data-state", placeState(p.id));
      b.setAttribute("data-role", p.role || "base");
      b.setAttribute("data-pid", p.id);
      b.setAttribute("aria-label", p.he + " - לחיצה לפתיחה, לחיצה כפולה לבחירה כבסיס");
      b.setAttribute("title", p.he);
      b.innerHTML =
        '<span class="label">' + esc(p.he) + (n ? '<span class="badge-n">' + n + '</span>' : '') + '</span>' +
        '<span class="head"></span><span class="stem"></span>';
      b.addEventListener("click", function (e) { e.stopPropagation(); selectPlace(p.id); });
      b.addEventListener("dblclick", function (e) { e.preventDefault(); e.stopPropagation(); quickPick(p.id); });
      pinsEl.appendChild(b);
    });
    resolveLabels();
  }

  /* Label placement. Each label tries a ring of candidate offsets around its pin and
     takes the first that collides with nothing already placed. Bases get first pick.
     If a secondary place finds no free spot it drops its label and reveals it on hover,
     so a label is never silently buried under another. */
  var CANDIDATES = [
    { x: 0, y: 0 },
    { x: 54, y: 0 }, { x: -54, y: 0 },
    { x: 0, y: 20 }, { x: 48, y: 20 }, { x: -48, y: 20 },
    { x: 0, y: 40 }, { x: 62, y: 40 }, { x: -62, y: 40 },
    { x: 0, y: 62 }, { x: 70, y: 62 }, { x: -70, y: 62 }
  ];

  function resolveLabels() {
    var pins = [].slice.call(pinsEl.querySelectorAll(".pin"));
    pins.forEach(function (p) {
      p.style.setProperty("--lift", "0px");
      p.style.setProperty("--dx", "0px");
      p.classList.remove("off", "nolabel");
    });

    // bases claim the prime spots; day trips and points of interest yield
    var order = pins.slice().sort(function (a, b) {
      var ra = a.getAttribute("data-role") === "base" ? 0 : 1;
      var rb = b.getAttribute("data-role") === "base" ? 0 : 1;
      if (ra !== rb) return ra - rb;
      return a.querySelector(".label").getBoundingClientRect().top -
             b.querySelector(".label").getBoundingClientRect().top;
    });

    var frame = document.querySelector(".mapwrap").getBoundingClientRect();
    var placed = [];
    function free(r) {
      // must stay inside the visible map frame, or it gets clipped
      if (r.left < frame.left + 4 || r.right > frame.right - 4 ||
          r.top < frame.top + 4 || r.bottom > frame.bottom - 4) return false;
      for (var i = 0; i < placed.length; i++) {
        var q = placed[i];
        if (!(r.right < q.left - 3 || r.left > q.right + 3 ||
              r.bottom < q.top - 2 || r.top > q.bottom + 2)) return false;
      }
      return true;
    }

    order.forEach(function (pin) {
      var lb = pin.querySelector(".label");
      var isBase = pin.getAttribute("data-role") === "base";
      var fitted = false;

      for (var i = 0; i < CANDIDATES.length; i++) {
        var c = CANDIDATES[i];
        pin.style.setProperty("--lift", c.y + "px");
        pin.style.setProperty("--dx", c.x + "px");
        var r = lb.getBoundingClientRect();
        if (free(r)) {
          if (c.x !== 0) pin.classList.add("off");   // sits beside the pin, no vertical leader
          placed.push({ left: r.left, right: r.right, top: r.top, bottom: r.bottom });
          fitted = true;
          break;
        }
      }

      if (!fitted) {
        pin.style.setProperty("--lift", "0px");
        pin.style.setProperty("--dx", "0px");
        if (isBase) {
          // never hide a base: keep it, just accept it sits on top
          placed.push(lb.getBoundingClientRect());
        } else {
          pin.classList.add("nolabel");            // revealed on hover / focus / selection
        }
      }
    });
  }

  /* Double-click a place: pick it, or un-pick it. A place you dropped yourself
     disappears again when un-picked, so dropping and un-dropping are symmetric. */
  function quickPick(pid) {
    var p = place(pid); if (!p) return;
    var mine = S.items.filter(function (i) { return i.pid === pid; });
    var lodge = mine.filter(function (i) { return i.cat === "lodging"; })[0];
    var isActive = mine.some(function (i) { return i.state !== "idea"; });

    // un-pick
    if (isActive) {
      if (p.custom && mine.length === 1 && lodge) {
        var snapshotP = Object.assign({}, p), snapshotI = Object.assign({}, lodge);
        removePlace(pid, true);
        toast("המקום " + p.he + " הוסר", function () {
          S.custom.push(snapshotP); S.items.push(snapshotI); save(); render();
        });
        return;
      }
      var prev = mine.map(function (i) { return { id: i.id, state: i.state }; });
      mine.forEach(function (i) { i.state = "idea"; });
      save(); render();
      toast(p.he + " כבר לא נבחרת", function () {
        prev.forEach(function (r) {
          var it = S.items.filter(function (x) { return x.id === r.id; })[0];
          if (it) it.state = r.state;
        });
        save(); render();
      });
      return;
    }

    // pick: revive an existing lodging idea, or create one
    if (lodge) {
      lodge.state = "chosen"; save(); render();
      toast(p.he + " נבחרה כבסיס", function () { lodge.state = "idea"; save(); render(); });
      return;
    }
    var nights = (p.role === "base") ? 4 : 1;
    var mid = p.lo ? (p.lo[0] + p.lo[1]) / 2 / RATE : 300;
    var item = {
      id: "i" + Date.now(), pid: pid, cat: "lodging",
      name: "לינה ב" + p.he, nights: nights,
      est: Math.round(mid * nights), state: "chosen"
    };
    S.items.push(item); save(); render();
    toast(p.he + " נבחרה כבסיס, " + nights + " לילות", function () {
      S.items = S.items.filter(function (x) { return x.id !== item.id; });
      save(); render();
    });
  }

  /* ============ VIEW CONTROLS ============ */
  var relayoutT = null;
  function applyView() {
    var t = S.view.tilt ? 52 : 0;
    plane.style.setProperty("--tilt", t + "deg");
    plane.style.setProperty("--zoom", S.view.zoom);
    plane.style.setProperty("--panx", S.view.x + "px");
    plane.style.setProperty("--pany", S.view.y + "px");
    document.getElementById("btn-tilt").classList.toggle("on", !!S.view.tilt);
    // Pin spacing changes with zoom/tilt. Labels must be measured only once the
    // transform has finished animating, otherwise we place them against mid-flight
    // positions; transitionend is the real signal, the timer is just a fallback.
    clearTimeout(relayoutT);
    relayoutT = setTimeout(resolveLabels, 620);
  }
  plane.addEventListener("transitionend", function (e) {
    if (e.propertyName !== "transform" || e.target !== plane) return;
    clearTimeout(relayoutT);
    resolveLabels();
  });
  /* The 3D tilt magnifies the near edge, so the drawn size is not the layout size.
     Measure what actually landed on screen and scale it to sit inside the frame. */
  function fitView() {
    var mw = document.querySelector(".mapwrap").getBoundingClientRect();
    var land = document.getElementById("g-land").getBoundingClientRect();
    if (!land.width || !land.height || !mw.width) return;
    var ratio = Math.min((mw.width * 0.88) / land.width, (mw.height * 0.86) / land.height);
    S.view.zoom = Math.max(0.35, Math.min(2.5, S.view.zoom * ratio));
    S.view.x = 0; S.view.y = 0;
    applyView();
  }

  window.addEventListener("resize", function () {
    clearTimeout(relayoutT);
    relayoutT = setTimeout(function () { fitView(); resolveLabels(); }, 220);
  });

  document.getElementById("btn-tilt").addEventListener("click", function () { S.view.tilt = S.view.tilt ? 0 : 1; applyView(); save(); });
  document.getElementById("btn-zin").addEventListener("click", function () { S.view.zoom = Math.min(3.2, S.view.zoom * 1.28); applyView(); save(); });
  document.getElementById("btn-zout").addEventListener("click", function () { S.view.zoom = Math.max(0.55, S.view.zoom / 1.28); applyView(); save(); });
  document.getElementById("btn-reset").addEventListener("click", function () {
    S.view = { tilt: 1, zoom: 1, x: 0, y: 0 };
    applyView();
    setTimeout(function () { fitView(); save(); }, 30);
  });

  var drag = null, dragMoved = false;
  plane.addEventListener("pointerdown", function (e) {
    drag = { sx: e.clientX, sy: e.clientY, ox: S.view.x, oy: S.view.y };
    dragMoved = false;
    plane.classList.add("dragging");
    plane.setPointerCapture(e.pointerId);
  });
  plane.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!dragMoved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) dragMoved = true;
    if (!dragMoved) return;
    S.view.x = drag.ox + dx;
    S.view.y = drag.oy + dy;
    applyView();
  });
  plane.addEventListener("pointerup", function (e) {
    if (!drag) return;
    drag = null; plane.classList.remove("dragging");
    if (dragMoved) save();
    try { plane.releasePointerCapture(e.pointerId); } catch (err) {}
    // let the click handler read dragMoved, then reset it
    setTimeout(function () { dragMoved = false; }, 0);
  });

  /* Turn a screen point into map coordinates. getScreenCTM accounts for the
     3D transform on the plane, which a plain bounding-rect ratio would not. */
  function pointToLatLng(e) {
    try {
      var m = svg.getScreenCTM();
      if (m) {
        var pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        var loc = pt.matrixTransform(m.inverse());
        return { lat: invLat(loc.y / VH), lng: invLng(loc.x / VW) };
      }
    } catch (err) {}
    var r = svg.getBoundingClientRect();
    return { lat: invLat((e.clientY - r.top) / r.height), lng: invLng((e.clientX - r.left) / r.width) };
  }

  /* double-click on open map = drop a new place, already picked as a base */
  svg.addEventListener("dblclick", function (e) {
    e.preventDefault();
    var c = pointToLatLng(e);
    if (!isFinite(c.lat) || !isFinite(c.lng)) return;
    var id = "c" + Date.now();
    S.custom.push({
      id: id, he: "מקום חדש", en: "", lat: c.lat, lng: c.lng,
      role: "base", note: "מקום שהוספתם. אפשר לשנות את השם ואת הפרטים כאן.", custom: true
    });
    S.items.push({
      id: "i" + Date.now(), pid: id, cat: "lodging",
      name: "לינה במקום חדש", nights: 1, est: 300, state: "chosen"
    });
    save(); selectPlace(id);
    var f = document.getElementById("pl-name");
    if (f) { f.focus(); f.select(); }
    toast("נוסף מקום. תנו לו שם.", function () { removePlace(id, true); });
  });

  /* click on open map = clear the selection (unless it was really a drag) */
  svg.addEventListener("click", function () {
    if (dragMoved) return;
    if (S.sel !== null) { S.sel = null; render(); }
  });

  /* remove a custom place and everything attached to it */
  function removePlace(pid, silent) {
    var p = place(pid);
    S.custom = S.custom.filter(function (x) { return x.id !== pid; });
    S.items = S.items.filter(function (x) { return x.pid !== pid; });
    delete S.order[pid];
    if (S.sel === pid) S.sel = null;
    save(); render();
    if (!silent && p) toast("המקום " + p.he + " הוסר");
  }

  /* strip every item from a built-in place, returning it to unselected */
  function clearPlace(pid) {
    var removed = S.items.filter(function (x) { return x.pid === pid; });
    if (!removed.length) return;
    S.items = S.items.filter(function (x) { return x.pid !== pid; });
    delete S.order[pid];
    save(); render();
    toast("נוקה " + (place(pid) ? place(pid).he : ""), function () {
      removed.forEach(function (r) { S.items.push(r); });
      save(); render();
    });
  }

  /* ============ TABS ============ */
  var TABS = ["coach", "place", "route", "budget", "sync"];
  function setTab(name) {
    S.tab = name;
    TABS.forEach(function (t) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
      document.getElementById("p-" + t).hidden = (t !== name);
    });
  }
  TABS.forEach(function (t) { document.getElementById("tab-" + t).addEventListener("click", function () { setTab(t); render(); }); });

  function selectPlace(id) { S.sel = id; setTab("place"); render(); }

  /* ============ RENDER: COACH ============ */
  function renderCoach() {
    var t = totals(), el = document.getElementById("p-coach"), h = "";
    var bases = routeOrder();
    var hasTokyoLodge = S.items.some(function (i) { return i.pid === "tokyo" && i.cat === "lodging" && i.state !== "idea"; });
    var kyotoBooked = S.items.some(function (i) { return i.pid === "kyoto" && i.cat === "lodging" && i.state === "booked"; });
    var kyotoChosen = S.items.some(function (i) { return i.pid === "kyoto" && i.cat === "lodging" && i.state !== "idea"; });
    var expChosen = S.items.filter(function (i) { return i.cat === "experience" && i.state !== "idea"; }).length;
    var trainChosen = S.items.some(function (i) { return i.cat === "intercity" && i.state !== "idea"; });

    h += '<div class="card"><h3>איפה אנחנו עומדים</h3>';
    h += budgetBarHTML(t);
    h += '</div>';

    var steps = [
      {
        done: bases.length >= 2,
        t: "להחליט על הבסיסים",
        d: bases.length >= 2
          ? "נבחרו <b>" + bases.length + "</b> בסיסים. אפשר לשנות בכל רגע בלשונית המסלול."
          : "ההחלטה הראשונה, כי היא קובעת גם את הלינה וגם את הרכבות. <b>לחיצה כפולה על עיר במפה בוחרת אותה כבסיס.</b>",
        go: { tab: "route" }
      },
      {
        done: hasTokyoLodge,
        t: "טוקיו: המלון הראשון",
        d: hasTokyoLodge
          ? "יש לינה בטוקיו. אפשר לעבור לקיוטו."
          : "מתחילים מטוקיו כי שם נוחתים. טווח מטרה ללילה: " + rangeHTML(13000, 18000) + ".",
        go: { tab: "place", pid: "tokyo" }
      },
      {
        done: kyotoBooked,
        t: "קיוטו: להזמין מוקדם",
        d: kyotoBooked
          ? "קיוטו מוזמנת ומשולמת. זו הייתה ההזמנה הדחופה ביותר."
          : "החדרים הטובים בקיוטו נחטפים לעונת השלכת. <b>יעד: לסגור עד ינואר.</b> טווח ללילה: " + rangeHTML(15000, 25000) + ".",
        go: { tab: "place", pid: "kyoto" }
      },
      {
        done: expChosen >= 2,
        t: "חוויות שדורשות הזמנה מראש",
        d: expChosen >= 2
          ? "נבחרו <b>" + expChosen + "</b> חוויות."
          : "ג׳יבלי דורש הזמנה מוקדמת ולעיתים הגרלה. שווה לבדוק מתי נפתחות ההזמנות לתאריכים שלנו.",
        go: { tab: "place", pid: "nagoya" }
      },
      {
        done: trainChosen,
        t: "רכבות בין הבסיסים",
        d: trainChosen
          ? "יש כרטיסי רכבת בתכנון."
          : "רק אחרי שהמסלול סגור. במסלול של שניים-שלושה בסיסים כרטיסים בודדים זולים מ-JR Pass.",
        go: { tab: "route" }
      },
      {
        done: t.nights >= TOTAL_NIGHTS,
        t: "לכסות את כל " + TOTAL_NIGHTS + " הלילות",
        d: t.nights > TOTAL_NIGHTS
          ? "<b>שובצו " + t.nights + " לילות, יותר מ-" + TOTAL_NIGHTS + ".</b> שווה לבדוק את חלוקת הלילות."
          : (t.nights >= TOTAL_NIGHTS
              ? "כל הלילות מכוסים."
              : "מכוסים <b>" + t.nights + "</b> מתוך <b>" + TOTAL_NIGHTS + "</b>. נותרו <b>" + (TOTAL_NIGHTS - t.nights) + "</b>."),
        go: { tab: "route" }
      }
    ];

    // the current stage is the first one still open; everything after it dims back
    var cur = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { cur = i; break; } }

    h += '<div class="card"><h3>סדר הפעולות המומלץ</h3>';
    steps.forEach(function (s, i) {
      var cls = s.done ? "done" : (i === cur ? "current" : "future");
      h += '<button class="step ' + cls + '" data-go=\'' + JSON.stringify(s.go) + '\'' +
           (i === cur ? ' aria-current="step"' : '') + '>' +
           '<span class="ic">' + (s.done ? "✓" : (i + 1)) + '</span>' +
           '<span class="body"><span class="t">' + s.t +
           (i === cur ? '<span class="now-chip">עכשיו</span>' : '') + '</span>' +
           '<span class="d">' + s.d + '</span></span></button>';
    });
    h += '</div>';

    h += '<div class="card"><h3>איך עובדים עם המפה</h3>' +
         '<div class="step"><span class="ic">1</span><span class="body"><span class="d">' +
         'לוחצים על עיר במפה, ונפתח לה כרטיס בלשונית <b>מקום</b>.</span></span></div>' +
         '<div class="step"><span class="ic">2</span><span class="body"><span class="d">' +

         '<div class="step"><span class="ic">3</span><span class="body"><span class="d">' +
         'מצאתם מלון ברשת? מעדכנים ל<b>נבחר</b> עם המחיר האמיתי מההצעה, והוא נכנס לתקציב המתוכנן.</span></span></div>' +
         '<div class="step"><span class="ic">4</span><span class="body"><span class="d">' +
         'אחרי שמשלמים, מסמנים <b>הוזמן ושולם</b> ורושמים כמה שילמנו בפועל. הסכום עובר לעמודת ששולם.</span></span></div>' +
         '</div>';

    h += '<div class="foot">כל שינוי נשמר מיד. לשיתוף עם מון, לשונית הסנכרון.</div>';
    el.innerHTML = h;

    el.querySelectorAll(".step[data-go]").forEach(function (b) {
      b.addEventListener("click", function () {
        var g;
        try { g = JSON.parse(b.getAttribute("data-go")); } catch (e) { return; }
        if (!g) return;
        if (g.pid) { selectPlace(g.pid); }
        else { setTab(g.tab); render(); }

  function budgetBarHTML(t) {
    var scale = Math.max(TIER.b.total * 1.12, t.committed * 1.06);
    var pPaid = (t.paid / scale) * 100, pPlan = (t.plan / scale) * 100;
    var posA = (TIER.a.total / scale) * 100, posB = (TIER.b.total / scale) * 100;

    var v, cls;
    if (t.committed <= TIER.a.total) { cls = "ok"; v = "בתוך רמה א׳. נשארו " + nis(TIER.a.total - t.committed) + " עד התקרה שלה."; }
    else if (t.committed <= TIER.b.total) { cls = "mid"; v = "בין רמה א׳ לרמה ב׳. נשארו " + nis(TIER.b.total - t.committed) + " עד רמה ב׳."; }
    else { cls = "over"; v = "מעל רמה ב׳ ב-" + nis(t.committed - TIER.b.total) + ". שווה לבדוק מה אפשר לקצץ."; }

    return '<div class="bbar">' +
      '<span class="seg paid" style="width:' + pPaid.toFixed(2) + '%"></span>' +
      '<span class="seg plan" style="width:' + pPlan.toFixed(2) + '%;right:' + pPaid.toFixed(2) + '%"></span>' +
      '</div>' +
      '<div class="tickrow">' +
      '<span class="tick a" style="right:' + posA.toFixed(2) + '%">א׳ ' + nis(TIER.a.total) + '</span>' +
      '<span class="tick b" style="right:' + posB.toFixed(2) + '%">ב׳ ' + nis(TIER.b.total) + '</span>' +
      '</div>' +
      '<div class="verdict ' + cls + '">' + v + '</div>';
  }

  /* ============ RENDER: PLACE ============ */
  function renderPlace() {
    var el = document.getElementById("p-place");
    if (!S.sel) {
      el.innerHTML = '<div class="card"><h3>לא נבחר מקום</h3>' +
        '<div class="step"><span class="ic">1</span><span class="body"><span class="d">' +
        '<b>לחיצה</b> על מקום במפה פותחת אותו כאן.</span></span></div>' +
        '<div class="step"><span class="ic">2</span><span class="body"><span class="d">' +
        '<b>לחיצה כפולה</b> על מקום בוחרת אותו כבסיס, ולחיצה כפולה נוספת מבטלת.</span></span></div>' +
        '<div class="step"><span class="ic">3</span><span class="body"><span class="d">' +
        '<b>לחיצה כפולה על המפה</b> מוסיפה מקום חדש במקום שלחצתם.</span></span></div>' +
        '</div>';
      return;
    }
    var p = place(S.sel);
    if (!p) { el.innerHTML = '<div class="empty">המקום לא נמצא.</div>'; return; }

    var h = '<div class="place-head"><h2>' + p.he + '</h2>' +
            (p.en ? '<span class="en">' + p.en + '</span>' : '') + '</div>';
    if (p.note) h += '<p class="place-note">' + p.note + '</p>';
    if (p.lo) h += '<div class="pricehint">טווח לינה מקובל כאן ללילה: ' + rangeHTML(p.lo[0], p.lo[1]) + '</div>';

    if (p.custom) {
      h += '<label class="fld">שם המקום<input class="in" id="pl-name" value="' + esc(p.he) + '"></label>';
    }

    var mine = S.items.filter(function (i) { return i.pid === p.id; });
    h += '<div class="card"><h3>פריטים במקום הזה</h3>';
    if (!mine.length) h += '<div class="empty">אין עדיין. הוסיפו למטה, או לחצו לחיצה כפולה על המקום במפה כדי לבחור אותו כבסיס.</div>';
    mine.forEach(function (it) {
      var amt = it.state === "booked" && it.actual != null ? it.actual : it.est;
      h += '<div class="item" data-s="' + it.state + '">' +
        '<div class="r1"><div><div class="nm">' + esc(it.name) + '</div>' +
        '<div class="meta">' + CATS[it.cat].ic + " " + CATS[it.cat].he +
        (it.nights ? " · " + it.nights + " לילות" : "") + '</div></div>' +
        '<div class="amt">' + nis(amt || 0) + '<span class="sec" style="display:block;text-align:left">' + yen((amt || 0) * RATE) + '</span></div></div>' +
        '<div class="segbtns" data-item="' + it.id + '">' +
          '<button data-v="idea" aria-pressed="' + (it.state === "idea") + '">רעיון</button>' +
          '<button data-v="chosen" aria-pressed="' + (it.state === "chosen") + '">נבחר</button>' +
          '<button data-v="booked" aria-pressed="' + (it.state === "booked") + '">שולם</button>' +
        '</div>' +
        '<div class="row">' +
          '<label class="fld">' + (it.state === "booked" ? "שולם בפועל (₪)" : "הערכה (₪)") +
          '<input class="in" type="number" min="0" step="10" data-edit="' + it.id + '" value="' + (amt || 0) + '"></label>' +
          (it.cat === "lodging" ? '<label class="fld">לילות<input class="in" type="number" min="0" max="19" data-nights="' + it.id + '" value="' + (it.nights || 0) + '"></label>' : '') +
          '<button class="btn ghost" data-del="' + it.id + '">מחיקה</button>' +
        '</div>' +
      '</div>';
    });
    h += '</div>';

    h += '<div class="card"><h3>הוספת פריט</h3>' +
      '<label class="fld">מה זה<input class="in" id="f-name" placeholder="למשל: מלון גראנד, ליד התחנה"></label>' +
      '<div class="row">' +
        '<label class="fld">קטגוריה<select class="in" id="f-cat">' +
          Object.keys(CATS).filter(function (c) { return c !== "flight"; }).map(function (c) {
            return '<option value="' + c + '"' + (c === "lodging" ? " selected" : "") + '>' + CATS[c].he + '</option>';
          }).join("") + '</select></label>' +
        '<label class="fld">מחיר (₪)<input class="in" type="number" id="f-est" min="0" step="10" value="0"></label>' +
        '<label class="fld">לילות<input class="in" type="number" id="f-nights" min="0" max="19" value="0"></label>' +
      '</div>' +
      '<button class="btn primary" id="f-add">הוספה</button></div>';

    var active = mine.some(function (i) { return i.state !== "idea"; });
    h += '<div class="card"><h3>פעולות על המקום</h3>' +
      '<button class="btn' + (active ? "" : " primary") + '" id="pl-toggle">' +
        (active ? "ביטול הבחירה במקום הזה" : "בחירת המקום כבסיס") + '</button>' +
      '<button class="btn ghost" id="pl-deselect">סגירה וחזרה למפה</button>' +
      (mine.length ? '<button class="btn ghost" id="pl-clear">הסרת כל הפריטים כאן</button>' : '') +
      (p.custom ? '<button class="btn ghost" id="pl-del">מחיקת המקום מהמפה</button>' : '') +
      '</div>';

    el.innerHTML = h;

    document.getElementById("pl-toggle").addEventListener("click", function () { quickPick(p.id); });
    document.getElementById("pl-deselect").addEventListener("click", function () {
      S.sel = null; setTab("coach"); render();
    });
    var clr = document.getElementById("pl-clear");
    if (clr) clr.addEventListener("click", function () { clearPlace(p.id); });
    var delp = document.getElementById("pl-del");
    if (delp) delp.addEventListener("click", function () {
      if (confirm("למחוק את " + p.he + " ואת כל מה שמשויך אליו?")) removePlace(p.id);
    });

    el.querySelectorAll(".segbtns button").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.parentNode.getAttribute("data-item"), v = b.getAttribute("data-v");
        var it = S.items.filter(function (x) { return x.id === id; })[0];
        if (!it) return;
        if (v === "booked" && it.actual == null) it.actual = it.est;
        it.state = v; save(); render();
      });
    });
    el.querySelectorAll("[data-edit]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var it = S.items.filter(function (x) { return x.id === inp.getAttribute("data-edit"); })[0];
        if (!it) return;
        var v = Number(inp.value) || 0;
        if (it.state === "booked") it.actual = v; else it.est = v;
        save(); render();
      });
    });
    el.querySelectorAll("[data-nights]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var it = S.items.filter(function (x) { return x.id === inp.getAttribute("data-nights"); })[0];
        if (!it) return;
        it.nights = Number(inp.value) || 0; save(); render();
      });
    });
    el.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del");
        S.items = S.items.filter(function (x) { return x.id !== id; });
        save(); render();
      });
    });
    var nameFld = document.getElementById("pl-name");
    if (nameFld) nameFld.addEventListener("change", function () {
      var v = nameFld.value.trim();
      if (v) { p.he = v; save(); render(); }
    });

    var addb = document.getElementById("f-add");
    if (addb) addb.addEventListener("click", function () {
      var nmEl = document.getElementById("f-name"), nm = nmEl.value.trim();
      if (!nm) { nmEl.focus(); return; }
      var item = {
        id: "i" + Date.now(), pid: p.id,
        cat: document.getElementById("f-cat").value,
        name: nm,
        est: Number(document.getElementById("f-est").value) || 0,
        nights: Number(document.getElementById("f-nights").value) || 0,
        state: "chosen"
      };
      S.items.push(item);
      save(); render();
      toast("נוסף: " + nm, function () {
        S.items = S.items.filter(function (x) { return x.id !== item.id; });
        save(); render();
      });
    });
  }

  /* ============ RENDER: ROUTE ============ */
  function renderRoute() {
    var el = document.getElementById("p-route"), ids = routeOrder(), t = totals();
    var over = t.nights > TOTAL_NIGHTS;
    var h = '<div class="card"><h3>כיסוי הלילות</h3>' +
      '<div class="nights-line"><span>מכוסים</span><b>' + t.nights + " / " + TOTAL_NIGHTS + '</b></div>' +
      '<div class="nightbar"><i class="' + (t.nights >= TOTAL_NIGHTS ? "full" : "") + '" style="width:' +
      Math.min(100, (t.nights / TOTAL_NIGHTS) * 100).toFixed(1) + '%"></i></div>';
    if (over) {
      h += '<div class="verdict over">שובצו ' + (t.nights - TOTAL_NIGHTS) + ' לילות יותר מהטיול. שווה לצמצם באחד הבסיסים.</div>';
    } else if (t.nights < TOTAL_NIGHTS) {
      h += '<div class="nights-line"><span>נותרו לשבץ</span><b>' + (TOTAL_NIGHTS - t.nights) + ' לילות</b></div>';
    }
    h += '</div>';

    h += '<div class="card"><h3>סדר הבסיסים</h3>';
    if (!ids.length) {
      h += '<div class="empty">אין בסיסים כרגע. לחיצה כפולה על מקום במפה בוחרת אותו כבסיס.</div>';
    } else {
      ids.forEach(function (id, i) {
        var p = place(id);
        var n = S.items.filter(function (x) { return x.pid === id && x.cat === "lodging" && x.state !== "idea"; })
                       .reduce(function (a, x) { return a + (Number(x.nights) || 0); }, 0);
        h += '<div class="rt"><span class="ord">' + (i + 1) + '</span>' +
             '<button class="nm rt-open" data-open="' + id + '">' + esc(p.he) + '</button>' +
             '<span class="ni">' + n + ' לילות</span>' +
             '<span class="mv"><button data-up="' + id + '" title="למעלה">▲</button>' +
             '<button data-dn="' + id + '" title="למטה">▼</button></span>' +
             '<button class="rt-x" data-off="' + id + '" title="ביטול הבחירה">✕</button></div>';
      });
      h += '<div class="foot" style="border:0;padding-top:2px">הקו הכתום במפה עובר לפי הסדר הזה. ✕ מבטל בחירה.</div>';
    }
    h += '</div>';

    h += '<div class="card"><h3>תזכורות למסלול</h3>' +
      '<div class="step"><span class="ic">!</span><span class="body"><span class="d">' +
      'קמיקוצ׳י נסגרת לעונה באמצע נובמבר. אם היא במסלול, לוודא תאריך סגירה.</span></span></div>' +
      '<div class="step"><span class="ic">!</span><span class="body"><span class="d">' +
      'שיא הקויו בקיוטו הוא בסוף נובמבר. אנחנו עוזבים ב-17.11, כלומר נתפוס את תחילת השיא.</span></span></div>' +
      '<div class="step"><span class="ic">!</span><span class="body"><span class="d">' +
      'טורניר הסומו בתאריכים שלנו נמצא בפוקואוקה, רחוק מאוד. החלופה: סיור אורוות בטוקיו.</span></span></div>' +
      '</div>';

    el.innerHTML = h;
    el.querySelectorAll("[data-up],[data-dn]").forEach(function (b) {
      b.addEventListener("click", function () {
        var up = b.hasAttribute("data-up"), id = b.getAttribute(up ? "data-up" : "data-dn");
        var list = routeOrder(), i = list.indexOf(id), j = up ? i - 1 : i + 1;
        if (j < 0 || j >= list.length) return;
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        list.forEach(function (x, k) { S.order[x] = k; });
        save(); render();
      });
    });
    el.querySelectorAll("[data-open]").forEach(function (b) {
      b.addEventListener("click", function () { selectPlace(b.getAttribute("data-open")); });
    });
    el.querySelectorAll("[data-off]").forEach(function (b) {
      b.addEventListener("click", function () { quickPick(b.getAttribute("data-off")); });
    });
  }

  /* ============ RENDER: BUDGET ============ */
  function renderBudget() {

      '<div class="nights-line"><span>שולם עד כה</span><b>' + nis(t.paid) + '</b></div>' +

      '</div>';

    h += '<div class="card"><h3>לפי קטגוריה, מול שתי הרמות</h3>';
    Object.keys(CATS).forEach(function (c) {
      var used = t.cat[c].paid + t.cat[c].plan;
      var ba = c === "flight" ? FLIGHTS_PAID : TIER.a.cat[c];

      h += '<div class="catrow' + (over ? " over" : "") + '">' +
        '<div class="top"><span>' + CATS[c].ic + " " + CATS[c].he + '</span>' +
        '<span class="nums">' + nis(used) + " / " + nis(ba) + " · " + nis(bb) + '</span></div>' +
        '<div class="meter"><i class="p" style="width:' + wp.toFixed(1) + '%"></i>' +
        '<i class="c" style="width:' + wc.toFixed(1) + '%"></i></div></div>';

    h += '<div class="foot" style="border:0">המספרים: בשימוש / תקרת רמה א׳ · תקרת רמה ב׳</div></div>';

      var tok = ghToken();
      if (!tok) {
        tok = prompt("הדביקו כאן מפתח גישה של GitHub עם הרשאת repo.\nיוצרים אותו ב: github.com/settings/tokens\nהמפתח נשמר רק בדפדפן הזה.");
        if (!tok) return;
        tok = tok.trim(); setGhToken(tok);
      }
      pubb.disabled = true; say("מפרסם...", "mid");
      publishRemote(tok)
        .then(function () { S.remoteStamp = new Date().toISOString(); save(); say("פורסם. התכנון עכשיו משותף."); renderSync(); })
        .catch(function (err) {
          var m = String(err && err.message || err);
          if (/Bad credentials|401/i.test(m)) { say("המפתח לא תקין. נסו שוב עם מפתח חדש.", "over"); setGhToken(""); }
          else if (/404|Not Found/i.test(m)) say("הריפו לא נמצא, או שלמפתח אין הרשאת repo.", "over");
          else if (/409|sha/i.test(m)) say("מישהו פרסם לפניכם. משכו קודם ואז פרסמו שוב.", "over");
          else say("הפרסום נכשל: " + m, "over");
        })
        .then(function () { if (pubb) pubb.disabled = false; });
    });

    var pullb = document.getElementById("sy-pull");
    if (pullb) pullb.addEventListener("click", function () {
      if (!confirm("למשוך את הגרסה המשותפת? מה שלא פורסם כאן יידרס.")) return;
      pullb.disabled = true; say("מושך...", "mid");
      pullRemote()
        .then(function (d) { if (d) { save(); render(); } else say("אין עדיין גרסה משותפת בענן.", "mid"); })
        .catch(function () { say("המשיכה נכשלה.", "over"); })
        .then(function () { if (pullb) pullb.disabled = false; });
    });

    var ct = document.getElementById("sy-cleartok");
    if (ct) ct.addEventListener("click", function (e) { e.preventDefault(); setGhToken(""); renderSync(); });

    var msg = document.getElementById("sy-msg");
    function say(txt, cls) { msg.innerHTML = '<div class="verdict ' + (cls || "ok") + '">' + txt + '</div>'; }

    var expb = document.getElementById("sy-exp");
    if (expb) expb.addEventListener("click", function () {
      var d = new Date();
      var p = function (x) { return (x < 10 ? "0" : "") + x; };
      var fn = "japan-plan-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ".json";
      expb.disabled = true;
      window.claude.downloads.save({ filename: fn, data: JSON.stringify(snapshot(), null, 2) })
        .then(function () { say("הקובץ נשמר. אפשר לשלוח אותו הלאה."); })
        .catch(function (err) {
          var c = err && err.code;
          if (c === "declined") say("הביטול נקלט, לא נשמר כלום.", "mid");
          else if (c === "rate_limited") say("יש כבר בקשת שמירה פתוחה. נסו שוב בעוד רגע.", "mid");
          else if (c === "too_large") say("התכנון גדול מדי לשמירה. אפשר להשתמש בהעתקה ללוח.", "over");
          else say("שמירה לא זמינה כרגע. השתמשו בהעתקה ללוח.", "over");
        })
        .then(function () { expb.disabled = false; });
    });

    document.getElementById("sy-copy").addEventListener("click", function () {
      var txt = JSON.stringify(snapshot());
      function ok() { say("הנתונים הועתקו. אפשר להדביק אותם בהודעה."); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok).catch(function () { say("ההעתקה נכשלה.", "over"); });
      } else { say("ההעתקה לא נתמכת בדפדפן הזה.", "over"); }
    });

    document.getElementById("sy-imp").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (!d || !Array.isArray(d.items)) throw new Error("bad");
          S.items = d.items; S.custom = Array.isArray(d.custom) ? d.custom : [];
          S.order = d.order && typeof d.order === "object" ? d.order : {};
          S.sel = null; save(); render();
        } catch (err) { say("הקובץ לא תקין. צריך קובץ שיוצא מהמפה הזו.", "over"); }
      };
      r.onerror = function () { say("קריאת הקובץ נכשלה.", "over"); };
      r.readAsText(f);
    });

    document.getElementById("sy-reset").addEventListener("click", function () {
      if (!confirm("לחזור להצעות ההתחלתיות? כל שינוי מקומי שלא פורסם יימחק.")) return;
      resetToBaseline(); save(); render();
    });
    document.getElementById("sy-empty").addEventListener("click", function () {
      if (!confirm("לנקות הכל ולהתחיל ממפה ריקה?")) return;
      S.items = []; S.custom = []; S.order = {}; S.sel = null;
      save(); render();
      toast("המפה ריקה. אפשר להתחיל מאפס.");
    });
  }

  /* ============ RENDER ============ */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  function render() {
    var t = totals();
    document.getElementById("s-paid").textContent = nis(t.paid);
    document.getElementById("s-plan").textContent = nis(t.plan);
    var left = TIER.b.total - t.committed;
    var leftEl = document.getElementById("s-left");
    leftEl.textContent = (left < 0 ? "-" : "") + nis(Math.abs(left));
    leftEl.style.color = left < 0 ? "var(--momiji)" : "";
    var nEl = document.getElementById("s-nights");
    nEl.textContent = t.nights + "/" + TOTAL_NIGHTS;
    nEl.style.color = t.nights > TOTAL_NIGHTS ? "var(--momiji)"
                    : (t.nights === TOTAL_NIGHTS ? "var(--jade)" : "");

    drawPins(); drawRoute();
    if (S.tab === "coach") renderCoach();
    if (S.tab === "place") renderPlace();
    if (S.tab === "route") renderRoute();
    if (S.tab === "budget") renderBudget();
    if (S.tab === "sync") renderSync();
  }

  var hadLocal = false, hadView = false;
  try {
    var rawLS = localStorage.getItem(KEY);
    hadLocal = !!rawLS;
    hadView = !!(rawLS && JSON.parse(rawLS).view);
  } catch (e) {}

  load();
  buildMap();
  applyView();
  setTab("coach");
  render();

  // first run: frame the map to whatever space this screen actually has
  // (fitView triggers the transform, and the relayout follows its transitionend)
  if (!hadView) {
    setTimeout(function () { fitView(); save(); }, 60);
  }

  // First visit on the hosted version: adopt the shared plan from the cloud.
  if (!hadLocal && (location.protocol === "http:" || location.protocol === "https:")) {
    pullRemote().then(function (d) { if (d) { save(); render(); } }).catch(function () {});
  }
})();
</script>
